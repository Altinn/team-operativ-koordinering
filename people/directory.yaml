# =============================================================================
# people/directory.yaml
# -----------------------------------------------------------------------------
# Contact resolution only. Kept SEPARATE from roles/registry.yaml on purpose:
#   - roles change rarely and are reviewed carefully (who has authority)
#   - contact details change often and are lower-stakes edits
#
# `slack` is the Slack member ID (Uxxxxxxxx), NOT the @handle — IDs are stable
# across display-name changes. Get it from a profile: ··· > Copy member ID.
#
# PRIVACY NOTE: phone numbers are personal data. This file is `Internt`-
# classified. Do not mirror it into public surfaces, logs, or URL params.
#
# ALL VALUES BELOW ARE PLACEHOLDERS. Replace person IDs, names, emails, phones
# and Slack IDs with real values before going live. Keep the person IDs in sync
# with roles/registry.yaml (holder/deputy must match keys here).
# =============================================================================

