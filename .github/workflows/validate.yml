# =============================================================================
# .github/workflows/validate.yml
# -----------------------------------------------------------------------------
# Runs on every PR touching roles/people/plans. This is what makes the
# role-indirection safe: you cannot merge a change that leaves a plan pointing
# at a non-existent person, an unknown role, or a broken playbook reference.
# The PR review + this gate together are the audit trail for "who holds what".
# =============================================================================
name: Valider beredskap-data

on:
  pull_request:
    paths: ["roles/**", "people/**", "plans/**", "scripts/**"]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - name: Referential integrity (roles -> people, groups -> roles)
        run: python scripts/resolve.py validate
      - name: Generated roster is in sync with source
        run: python scripts/generate_roster.py --check
      - name: Render every playbook (catches broken role refs in steps)
        run: |
          for lvl in yellow red; do
            echo "== $lvl =="
            python scripts/activate.py "$lvl" --dry-run > /dev/null
          done
      - name: Lint YAML parses
        run: |
          python - <<'PY'
          import yaml, pathlib, sys
          bad = 0
          for p in pathlib.Path('.').rglob('*.y*ml'):
              if '.github' in str(p): continue
              try: yaml.safe_load(p.read_text())
              except Exception as e:
                  print(f"FATAL {p}: {e}"); bad = 1
          sys.exit(bad)
          PY
