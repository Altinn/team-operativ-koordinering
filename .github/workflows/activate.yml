# =============================================================================
# .github/workflows/activate.yml
# -----------------------------------------------------------------------------
# Two activation paths into one job:
#   - workflow_dispatch    : the BUTTON (Actions tab dropdown, or Slack slash
#                            command via a thin proxy that calls the GH API)
#   - repository_dispatch  : EVENT-DRIVEN (Statuspage / Azure Monitor POSTs to
#                            the dispatches endpoint)
#
# The job: validate -> render -> create incident Issue -> post Slack.
# It performs NOTIFICATION + LOGGING only. It never declares or stands down a
# tier; humans do that in the wizard. State transitions are decision-gated.
# =============================================================================
name: Aktiver kontinuitetsplan

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Eskaleringsnivå"
        required: true
        type: choice
        options: [yellow, red]
      plan:
        description: "Plan-ID"
        required: true
        default: bod-altinn3
        type: string
      category:
        description: "Kategori (drift/sikkerhet)"
        required: false
        type: choice
        options: ["", drift, sikkerhet]
      affected:
        description: "Berørte funksjoner (komma-separert)"
        required: false
        type: string
  repository_dispatch:
    types: [beredskap-activate]

permissions:
  issues: write
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }

      - run: pip install pyyaml

      # Resolve inputs from whichever trigger fired.
      # SECURITY: untrusted inputs / client_payload are passed via `env:` and
      # read as shell variables — never interpolated with ${{ }} into the script
      # body (which would allow command injection). Newlines are stripped before
      # values reach $GITHUB_ENV so they cannot inject extra variables.
      - name: Resolve inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          DI_LEVEL: ${{ inputs.level }}
          DI_PLAN: ${{ inputs.plan }}
          DI_CATEGORY: ${{ inputs.category }}
          DI_AFFECTED: ${{ inputs.affected }}
          CP_LEVEL: ${{ github.event.client_payload.level }}
          CP_PLAN: ${{ github.event.client_payload.plan }}
          CP_CATEGORY: ${{ github.event.client_payload.category }}
          CP_AFFECTED: ${{ github.event.client_payload.affected }}
          CP_SOURCE: ${{ github.event.client_payload.source }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            LEVEL="$CP_LEVEL"; PLAN="$CP_PLAN"; CATEGORY="$CP_CATEGORY"; AFFECTED="$CP_AFFECTED"; BY="event:$CP_SOURCE"
          else
            LEVEL="$DI_LEVEL"; PLAN="$DI_PLAN"; CATEGORY="$DI_CATEGORY"; AFFECTED="$DI_AFFECTED"; BY="@$ACTOR"
          fi
          strip() { printf '%s' "$1" | tr -d '\r\n'; }
          {
            printf 'IN_LEVEL=%s\n'    "$(strip "$LEVEL")"
            printf 'IN_PLAN=%s\n'     "$(strip "$PLAN")"
            printf 'IN_CATEGORY=%s\n' "$(strip "$CATEGORY")"
            printf 'IN_AFFECTED=%s\n' "$(strip "$AFFECTED")"
            printf 'IN_BY=%s\n'       "$(strip "$BY")"
          } >> "$GITHUB_ENV"

      # Fail fast if the registry is internally inconsistent
      - name: Validate registry
        run: python scripts/resolve.py validate

      - name: Render issue + Slack artifacts
        run: |
          python scripts/activate.py "$IN_LEVEL" \
            --plan "$IN_PLAN" \
            --by "$IN_BY" \
            --category "$IN_CATEGORY" \
            --affected "$IN_AFFECTED"

      - name: Create incident issue
        id: issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('build/issue_body.md', 'utf8');
            const level = process.env.IN_LEVEL;
            const plan  = process.env.IN_PLAN;
            const stamp = new Date().toISOString().slice(0,16).replace('T',' ');
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[${level.toUpperCase()}] ${plan} — ${stamp}`,
              body,
              labels: ['beredskap', `niva:${level}`, `plan:${plan}`],
            });
            core.setOutput('url', issue.data.html_url);
            core.setOutput('number', issue.data.number);

      # Re-render Slack now that we have the issue URL, then post.
      - name: Post to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_INCIDENT_CHANNEL: ${{ secrets.SLACK_INCIDENT_CHANNEL }}
        run: |
          python scripts/activate.py "$IN_LEVEL" \
            --plan "$IN_PLAN" \
            --by "$IN_BY" \
            --category "$IN_CATEGORY" \
            --affected "$IN_AFFECTED" \
            --issue-url "${{ steps.issue.outputs.url }}"
          python scripts/notify_slack.py build/slack.json
