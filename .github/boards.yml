# One entry per project board. The sync workflow adds every open issue in
# `owners` carrying any of `labels` to Projects v2 project `project`.
#
# gh ANDs repeated --label, so the workflow runs one search per label and unions
# the results. Don't collapse them into a single search — that returns the AND.
#
# `owners` must be non-empty: an unscoped search matches the label across all of
# GitHub. The workflow validates this before searching.

boards:
  - name: UU (accessibility)
    project: 193
    owner: Altinn          # org owning the board
    owners:                # orgs to search
      - Altinn
      - digdir
    labels:
      - wcag
      - area/accessibility
      - "♿️ accessibility"   # U+267F + U+FE0F — must match the label byte-for-byte
